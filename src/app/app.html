<div class="shell" [class.console-collapsed]="log.collapsed()">
  <header class="topbar">
    <span class="brand">libreOSINT</span>
    <app-menubar />
    <span class="case-title">
      <span #wrap class="case-name-wrap" [attr.data-value]="store.caseName()">
      <input
        #nameInput
        class="case-name"
        aria-label="Investigation name"
        title="Click to rename"
        [value]="store.caseName()"
        (change)="rename(nameInput)"
        (keydown.enter)="nameInput.blur()"
        (keydown.escape)="nameInput.value = store.caseName(); wrap.dataset['value'] = store.caseName(); nameInput.blur()"
        (input)="wrap.dataset['value'] = nameInput.value"
      />
      </span>
      @if (store.dirty()) {
        <span class="dirty-dot" title="Unsaved changes">●</span>
      }
      @if (caseFile.fileName(); as f) {
        <span class="muted mono file-name" [attr.title]="caseFile.path()">{{ f }}</span>
      }
    </span>
    <span class="spacer"></span>
    @if (network.badge(); as b) {
      <button type="button" class="net-badge" [attr.title]="'Lookups go through ' + network.displayProxy() + ' — click to change'" (click)="ui.settingsOpen.set(true)">
        ● via {{ b }}
      </button>
    } @else if (network.missingUrl()) {
      <button type="button" class="net-badge" title="Proxy mode is on but no proxy URL is set, so lookups are blocked. Click to fix." (click)="ui.settingsOpen.set(true)">
        ⚠ no proxy URL
      </button>
    }
    <span class="muted counts">{{ store.counts().entities }} entities · {{ store.counts().edges }} links</span>
    <button type="button" (click)="theme.toggle()" [attr.aria-label]="'Switch to ' + (theme.theme() === 'light' ? 'dark' : 'light') + ' mode'">
      {{ theme.theme() === 'light' ? '☾ Dark' : '☀ Light' }}
    </button>
  </header>
  <aside class="pane palette-pane"><app-palette /></aside>
  <main class="pane center-pane"><app-canvas /></main>
  <aside class="pane inspector-pane"><app-sidebar /></aside>
  <section class="pane console-pane">
    <app-console [collapsed]="log.collapsed()" (toggle)="log.collapsed.set(!log.collapsed())" />
  </section>
</div>
@if (ui.aboutOpen()) {
  <app-about />
}
@if (ui.settingsOpen()) {
  <app-settings />
}
