[package]
name = "libre-osint"
version = "0.1.0"
description = "Local-first OSINT link-analysis workbench"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (Tauri convention).
name = "libre_osint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["json"] }
# Phase 3 (vault): keyring = "3"
# Phase 4: serde_yaml / quick-xml

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
